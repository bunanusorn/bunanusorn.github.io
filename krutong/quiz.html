 ["A. 25,000", "B. 2012", "C. 1, 2, 4", "D. 1978"], "answerIndex": 2, "answerText": "C. 1, 2, 4", "randomized": true}, {"qEn": "11. Complete the summary by selecting the THREE", "qTh": "11. เติมสรุปให้สมบูรณ์โดยเลือก 3 ข้อ สรุป: วิศวกรรมโรมันโบราณสร้างโครงสร้างที่สนับสนุนทั้งจักรวรรดิและอารยธรรมรุ่นหลัง A. วิศวกรโรมันพัฒนาโครงสร้างพื้นฐานที่เสริมการคมนาคมและชีวิตเมือง B. โคลอสเซียมแสดงวิธีก่อสร้างขั้นสูงและวัสดุทนทาน C. ศิลปินโรมันชอบการวาดภาพมากกว่าสถาปัตยกรรม D. ท่อส่งนํ้าจ่ายนํ้าและถนนเชื่อมภูมิภาคไกลกัน E. วิศวกรโรมันปฏิเสธการทดลองเทคนิคก่อสร้างใหม่ F. สถาปนิกสมัยใหม่ยังเรียนรู้จากความสําเร็จด้านวิศวกรรมโรมัน เฉลย: A, D และ F", "options": ["A. Because local authorities prohibited public gatherings in city centers", "B. A sudden decline in urban population caused by severe droughts", "C. choices that express the most important ideas. ; Summary ; Ancient Roman engineering produced structures that supported ; both the empire and later civilizations. ; Choices ; A. Roman engineers developed infrastructure that strengthened ; transportation and urban life. ; B. The Colosseum demonstrated advanced construction ; methods and durable materials. ; C. Roman artists preferred painting to architecture. ; D. Aqueducts supplied water while roads connected distant ; regions. ; E. Roman engineers refused to experiment with new building ; techniques. ; F. Modern architects continue to learn from Roman engineering ; achievements. ; ■ ; A, D, F", "D. It occurs only in regions with extreme polar weather conditions"], "answerIndex": 2, "answerText": "C. choices that express the most important ideas. ; Summary ; Ancient Roman engineering produced structures that supported ; both the empire and later civilizations. ; Choices ; A. Roman engineers developed infrastructure that strengthened ; transportation and urban life. ; B. The Colosseum demonstrated advanced construction ; methods and durable materials. ; C. Roman artists preferred painting to architecture. ; D. Aqueducts supplied water while roads connected distant ; regions. ; E. Roman engineers refused to experiment with new building ; techniques. ; F. Modern architects continue to learn from Roman engineering ; achievements. ; ■ ; A, D, F", "randomized": true}]}, {"index": 8, "title": "#9 · Reading_The Acoustics of Ancient Theaters and Modern Architectural Design (2026-11-07)", "type": "Reading", "questions": [{"qEn": "Question 1 Main Idea What is the main purpose of the passage?", "qTh": "ข้อ 1 ใจความสําคัญ จุดประสงค์หลักของบทความคืออะไร A. เปรียบเทียบต้นทุนก่อสร้างโรงละครโบราณกับสมัยใหม่ B. อธิบายว่าหลักอะคูสติกโบราณยังเกี่ยวข้องกับการออกแบบสถาปัตยกรรมสมัยใหม่ C. แสดงว่าโรงละครสมัยใหม่ด้อยกว่าโรงละครโบราณด้านเสียง D. อธิบายพัฒนาการของเครื่องดนตรี เฉลย: B Question 2 Factual Information According to the passage, which factors contributed to the sound quality of ancient theaters? A. Artificial amplification and electronic equipment B. The size of the audience and the performers’ clothing C. Architectural design, construction materials, and natural surroundings D. Modern simulations and adjustable acoustic systems Answer: C. Architectural design, construction materials, and natural surroundings ข้อ 2 ข้อมูลตามเนื้อหา ตามบทความ ปัจจัยใดช่วยให้โรงละครโบราณมีคุณภาพเสียงดี A. การขยายเสียงและอุปกรณ์อิเล็กทรอนิกส์ B. ขนาดผู้ชมและเครื่องแต่งกายนักแสดง C. การออกแบบสถาปัตยกรรม วัสดุก่อสร้าง และสภาพธรรมชาติรอบๆ D. การจําลองสมัยใหม่และระบบอะคูสติกปรับได้ เฉลย: C Question 3 Vocabulary The word “propagate” in paragraph 2 is closest in meaning to: A. Absorb B. Travel C. Disappear D. Distort Answer: B. Travel ข้อ 3 คําศัพท์ คําว่า “propagate” ในย่อหน้า 2 มีความหมายใกล้เคียงที่สุดกับ A. ดูดซับ B. เดินทาง C. หายไป D. บิดเบือน เฉลย: B Question 4 Factual Information What role do the limestone seats reportedly play in ancient theaters? A. They amplify every frequency equally. B. They eliminate all forms of background noise. C. They prevent sound from reaching distant audiences. D. They help reduce background noise while allowing speech frequencies to remain clear. Answer: D. They help reduce background noise while allowing speech frequencies to remain clear. ข้อ 4 ข้อมูลตามเนื้อหา ที่นั่งหินปูนมีบทบาทอย่างไรในโรงละครโบราณ A. ขยายทุกความถี่เท่ากัน B. กําจัดเสียงรบกวนทุกชนิด C. ป้องกันไม่ให้เสียงไปถึงผู้ชมที่ไกล D. ช่วยลดเสียงรบกวนพื้นหลังขณะที่ความถี่เสียงพูดยังชัด เฉลย: D Question 5 Inference What can be inferred about ancient architects from the passage? A. They relied exclusively on written scientific theories. B. They achieved effective acoustic results through observation and practical experimentation. C. They understood every aspect of modern acoustic engineering. D. They designed theaters primarily for orchestral concerts. Answer: B. They achieved effective acoustic results through observation and practical experimentation. ข้อ 5 การอนุมาน อนุมานอะไรได้เกี่ยวกับสถาปนิกโบราณ A. พึ่งทฤษฎีวิทยาศาสตร์ที่เขียนไว้เท่านั้น B. ได้ผลด้านเสียงจากการสังเกตและทดลองจริง C. เข้าใจทุกด้านของวิศวกรรมอะคูสติกสมัยใหม่ D. ออกแบบโรงละครเพื่อคอนเสิร์ตออร์เคสตราเป็นหลัก เฉลย: B Question 6 Reference In paragraph 2, the phrase “These features” refers to: A. The seating arrangement, auditorium shape, and reflective properties of stone B. The digital simulations used by modern engineers C. The different types of performances held today D. The natural surroundings of all modern buildings Answer: A. The seating arrangement, auditorium shape, and reflective properties of stone ข้อ 6 การอ้างอิง ในย่อหน้า 2 วลี “These features” หมายถึง A. การจัดที่นั่ง รูปร่างหอประชุม และคุณสมบัติสะท้อนของหิน B. การจําลองดิจิทัลที่วิศวกรสมัยใหม่ใช้ C. การแสดงประเภทต่างๆ ในปัจจุบัน D. สภาพธรรมชาติรอบอาคารสมัยใหม่ทั้งหมด เฉลย: A Question 7 Purpose Why does the author mention orchestral concerts and theatrical productions in paragraph 3? A. To argue that theater audiences prefer music to drama B. To show that ancient theaters were designed for only two types of events C. To illustrate the different acoustic requirements of modern performances D. To suggest that modern technology has made architecture unnecessary Answer: C. To illustrate the different acoustic requirements of modern performances ข้อ 7 จุดประสงค์ เหตุใดผู้เขียนจึงกล่าวถึงคอนเสิร์ตออร์เคสตราและการแสดงละครในย่อหน้า 3 A. เพื่อโต้ว่าผู้ชมชอบดนตรีมากกว่าละคร B. เพื่อแสดงว่าโรงละครโบราณออกแบบไว้สําหรับงานเพียงสองประเภท C. เพื่อชี้ให้เห็นความต้องการด้านเสียงที่ต่างกันของการแสดงสมัยใหม่ D. เพื่อเสนอว่าเทคโนโลยีสมัยใหม่ทําให้สถาปัตยกรรมไม่จําเป็น เฉลย: C Question 8 Vocabulary The word “ingenuity” in paragraph 2 is closest in meaning to: A. Creativity and cleverness B. Financial efficiency C. Physical strength D. Scientific uncertainty Answer: A. Creativity and cleverness ข้อ 8 คําศัพท์ คําว่า “ingenuity” ในย่อหน้า 2 มีความหมายใกล้เคียงที่สุดกับ A. ความสร้างสรรค์และความฉลาด B. ประสิทธิภาพทางการเงิน C. กําลังกาย D. ความไม่แน่นอนทาง วิทยาศาสตร์ เฉลย: A Question 9 Sentence Simplification Which sentence best expresses the meaning of the following statement? “Although modern technology offers greater control over sound, the fundamental principles demonstrated by these historical structures remain relevant today.” A. Modern technology has made all ancient acoustic principles obsolete. B. Ancient theaters are useful only when modern equipment is unavailable. C. Modern architects must choose between historical principles and technological advances. D. Despite technological progress, the basic acoustic lessons from ancient theaters are still valuable. Answer: D. Despite technological progress, the basic acoustic lessons from ancient theaters are still valuable. ข้อ 9 การทําประโยคให้เรียบง่าย ประโยคใดสื่อความหมายของข้อความ “แม้เทคโนโลยีสมัยใหม่ควบคุมเสียงได้มากขึ้น หลักการพื้นฐานจาก โครงสร้างประวัติศาสตร์เหล่านี้ยังใช้ได้ในปัจจุบัน” ได้ดีที่สุด A. เทคโนโลยีสมัยใหม่ทําให้หลักอะคูสติกโบราณล้าสมัยทั้งหมด B. โรงละครโบราณมีประโยชน์เฉพาะเมื่อไม่มีอุปกรณ์สมัยใหม่ C. สถาปนิกสมัยใหม่ต้องเลือกระหว่างหลักประวัติศาสตร์กับความก้าวหน้าทางเทคโนโลยี D. แม้เทคโนโลยีก้าวหน้า บทเรียนพื้นฐานด้านเสียงจากโรงละครโบราณยังมีค่า เฉลย: D Question 10 Inference Why do contemporary performance venues require flexible acoustic systems? A. Because all performances require identical sound conditions B. Because different events require different acoustic characteristics C. Because stone cannot reflect sound effectively D. Because modern audiences cannot hear unamplified speech Part 2: Advanced Reading Questions Answer: B. Because different events require different acoustic characteristics ข้อ 10 การอนุมาน เหตุใดสถานที่แสดงสมัยใหม่จึงต้องมีระบบเสียงที่ยืดหยุ่น A. เพราะทุกการแสดงต้องการสภาพเสียงเหมือนกัน B. เพราะงานต่างกันต้องการลักษณะเสียงต่างกัน C. เพราะหินสะท้อนเสียงไม่ได้ D. เพราะผู้ชมสมัยใหม่ได้ยินเสียงพูดโดยไม่ขยายไม่ได้ เฉลย: B Question 11 — Insert a Sentence Where would the following sentence best fit in paragraph 3? “This adaptability is essential because the ideal acoustic environment varies according to the type of performance.” A. After the first sentence of paragraph 3 B. After the sentence describing the different events modern venues must accommodate C. After the sentence describing digital simulations and adjustable systems D. At the end of paragraph 4 Answer: B. After the sentence describing the different events modern venues must accommodate ส่วนที่ 2: คําถามขั้นสูง ข้อ 11 — แทรกประโยค ประโยค “ความยืดหยุ่นนี้จําเป็นเพราะสภาพเสียงที่เหมาะสมที่สุดแตกต่างกันตามประเภทการแสดง” เหมาะกับ ตําแหน่งใดในย่อหน้า 3 A. หลังประโยคแรกของย่อหน้า 3 B. หลังประโยคที่อธิบายงานหลายประเภทที่สถานที่สมัยใหม่ต้องรองรับ C. หลังประโยคที่อธิบายการจําลองดิจิทัลและระบบปรับได้ D. ท้ายย่อหน้า 4 เฉลย: B Question 12 — Prose Summary Select THREE statements that best summarize the major ideas of the passage. A. Ancient architects developed effective acoustic environments through observation and practical experimentation. B. Limestone seats were the only factor responsible for the acoustic success of ancient theaters. C. The physical design and materials of ancient theaters contributed to sound distribution and speech clarity. D. Modern architectural acoustics no longer depends on principles discovered through historical research. E. Contemporary venues use advanced technologies to meet the different acoustic requirements of performances. F. Ancient theaters were designed specifically to accommodate modern orchestral concerts.", "options": ["A. To compare the construction costs of ancient and modern theaters", "B. To explain how ancient acoustic principles remain relevant to modern architectural design", "C. To demonstrate that modern theaters are acoustically inferior to ancient theaters", "D. To describe the historical development of musical instruments"], "answerIndex": 1, "answerText": "B. To explain how ancient acoustic principles remain relevant to modern architectural design", "randomized": false}, {"qEn": "Question 12: A, C, E", "qTh": "ข้อ 12 — สรุปเรื่อง เลือก 3 ข้อที่สรุปแนวคิดหลักของบทความได้ดีที่สุด A. สถาปนิกโบราณสร้างสภาพเสียงที่ดีจากการสังเกตและทดลองจริง B. ที่นั่งหินปูนเป็นปัจจัยเดียวที่ทําให้โรงละครโบราณเสียงดี C. การออกแบบและวัสดุของโรงละครโบราณช่วยกระจายเสียงและความชัดของคําพูด D. อะคูสติกสถาปัตยกรรมสมัยใหม่ไม่พึ่งหลักการที่ค้นพบจากงานวิจัยประวัติศาสตร์อีกต่อไป E. สถานที่สมัยใหม่ใช้เทคโนโลยีขั้นสูงตอบโจทย์เสียงที่ต่างกันของการแสดง F. โรงละครโบราณออกแบบมาเพื่อรองรับคอนเสิร์ตออร์เคสตราสมัยใหม่โดยเฉพาะ เฉลย: A, C, E", "options": ["A. A, C, E", "B. To compare ancient religious rituals with modern legal systems", "C. It allows modern industries to operate without any electricity", "D. Because local authorities prohibited public gatherings in city centers"], "answerIndex": 0, "answerText": "A. A, C, E", "randomized": true}]}, {"index": 9, "title": "#11 · 41_Reading_Genetic therapy and promise ethic concern (2026-06-21)", "type": "Reading", "questions": [{"qEn": "1. What is genetic therapy?", "qTh": "1. การบําบัดทางพันธุกรรมคืออะไร A. ยารักษาการติดเชื้อ B. วิธีปรับเปลี่ยนยีนเพื่อรักษาโรค C. การร andomized": false}, {"qEn": "Question 2. According to paragraph 2, what is the primary source of ocean plastic pollution?", "qTh": "ข้อ 2. ตามย่อหน้า 2 แหล่งหลักของมลพิษพลาสติกในทะเลคืออะไร A. ภูเขาไฟใต้นํ้า B. แหล่งบนบก เช่น แม่นํ้าและเมืองชายฝั่ง C. แนวปะการัง D. สิ่งมีชีวิตทะเลลึก เฉลย: B", "options": ["A. Underwater volcanoes", "B. Land-based sources such as rivers and coastal cities", "C. Coral reefs", "D. Deep-sea organisms"], "answerIndex": 1, "answerText": "B. Land-based sources such as rivers and ; coastal cities", "randomized": false}, {"qEn": "Question 3. What does the word “bioaccumulating” in paragraph 2 most nearly mean?", "qTh": "ข้อ 3. คําว่า “bioaccumulating” ในย่อหน้า 2 หมายถึงอะไรมากที่สุด A. แตกตัวเป็นสารไม่เป็นอันตราย B. เคลื่อนผ่านนํ้าเร็ว C. สะสมในสิ่งมีชีวิตตามเวลา D. จมลงก้นทะเล เฉลย: C", "options": ["A. Breaking down into harmless substances", "B. Moving quickly through water", "C. Building up in living organisms over time", "D. Sinking to the ocean floor"], "answerIndex": 2, "answerText": "C. Building up in living organisms over time", "randomized": false}, {"qEn": "Question 4. What can be inferred from paragraph 4?", "qTh": "ข้อ 4. อนุมานอะไรได้จากย่อหน้า 4 A. รัฐบาลแก้มลพิษพลาสติกได้เพียงลําพัง B. รีไซเคิลเป็นทางแก้เดียวที่ได้ผล C. การแก้ปัญหาต้องทั้งเปลี่ยน นโยบายและพฤติกรรมรายบุคคล D. มลพิษพลาสติกกระทบเฉพาะประเทศชายฝั่ง เฉลย: C", "options": ["A. Governments alone can solve plastic pollution.", "B. Recycling is the only effective solution.", "C. Solving the problem requires both policy changes and individual behavior changes.", "D. Plastic pollution affects only coastal countries."], "answerIndex": 2, "answerText": "C. Solving the problem requires both policy ; changes and individual behavior changes.", "randomized": false}, {"qEn": "Question 5. Which of the following is NOT mentioned as an impact of plastic pollution?", "qTh": "ข้อ 5. ข้อใดไม่ได้กล่าวถึงเป็นผลกระทบของมลพิษพลาสติก A. สภาพอากาศดีขึ้น B. โรคในปะการัง C. นกทะเลตาย D. ความส erText": "B. Remain for a long time", "randomized": false}, {"qEn": "Question 8. Where does most ocean plastic pollution come from?", "qTh": "ข้อ 8. มลพิษพลาสติกในทะเลส่วนใหญ่มาจากไหน A. การขุดแร่ทะเลลึก B. ภูเขาไฟระเบิด C. แหล่งบนบก เช่น แม่นํ้าและเมืองชายฝั่ง D. แนวปะการัง เฉลย: C", "options": ["A. Deep-sea mining", "B. Volcanic eruptions", "C. Land-based sources such as rivers and coastal cities", "D. Coral reefs"], "answerIndex": 2, "answerText": "C. Land-based sources such as rivers and ; coastal cities", "randomized": false}, {"qEn": "Question 9. What are microplastics?", "qTh": "ข้อ 9. ไมโครพลาสติกคืออะไร A. ปลาตัวเล็กที่กินพลาสติก B. อนุภาคพลาสติกเล็กที่ตั้งใจสร้างหรือเกิดจากพลาสติกชิ้นใหญ่แตกตัว C. แร่ธาตุ ธรรมชาติในทะเล D. วัสดุย่อยสลายได้ เฉลย: B", "options": ["A. Tiny fish that consume plastic", "B. Small plastic particles created intentionally or from larger plastics breaking down", "C. Natural ocean minerals", "D. Biodegradable materials"], "answerIndex": 1, "answerText": "B. Small plastic particles created intentionally ; or from larger plastics breaking down", "randomized": false}, {"qEn": "Question 10. What is the main purpose of paragraph 4?", "qTh": "ข้อ 10. จุดประสงค์หลักของย่อหน้า 4 คืออะไร A. อธิบายสาเหตุมลพิษ B. อธิบายต้นทุนเศรษฐกิจ C. เสนอทางแก้ที่เป็นไปได้ D. เปรียบเทียบมหาสมุทรต่างๆ เฉลย: C", "options": ["A. To describe the causes of pollution", "B. To explain the economic costs", "C. To present possible solutions to the problem", "D. To compare different oceans"], "answerIndex": 2, "answerText": "C. To present possible solutions to the problem", "randomized": false}, {"qEn": "Question 11. According to the passage, which action addresses pollution at its source?", "qTh": "ข้อ 11. ตามบทความ การกระทําใดแก้มลพิษที่ต้นทาง A. ทําความสะอาดชายหาด B. พัฒนาทางเลือกที่ย่อยสลายได้ C. สร้างแนวปะการัง D. เพิ่มการท่องเที่ยว เฉลย: B", "options": ["A. Cleaning beaches", "B. Developing biodegradable alternatives", "C. Building coral reefs", "D. Increasing tourism"], "answerIndex": 1, "answerText": "B. Developing biodegradable alternatives", "randomized": false}, {"qEn": "Question 12. What can be inferred about solving plastic pollution?", "qTh": "ข้อ 12. อนุมานอะไรได้เกี่ยวกับการแก้มลพิษพลาสติก A. ประเทศเดียวแก้ได้ B. ต้องอาศัยความร่วมมือและการเปลี่ยนพฤติกรรมผู้บริโภค C. รีไซเคิลไม่จําเป็น D. สัตว์ ทะเลปรับตัวได้ง่าย เฉลย: B", "options": ["A. It can be solved by one country alone.", "B. It requires cooperation and changes in consumer behavior.", "C. Recycling is unnecessary.", "D. Marine animals can adapt easily."], "answerIndex": 1, "answerText": "B. It requires cooperation and changes in ; consumer behavior.", "randomized": false}, {"qEn": "Question 13. What is the main idea of the passage?", "qTh": "ข้อ 13. คําถามใจความสําคัญ: ใจความสําคัญของบทความคืออะไร A. มลพิษพลาสติกเป็นปัญหาแพร่หลายที่มีผลร้ายแรงและต้องอาศัยการลงมือระดับโลก B. แพขยะแปซิฟิกใหญ่ เป็นพื้นที่ปนเปื้อนแห่งเดียว C. แนวปะการังเป็นระบบนิเวศที่สําคัญที่สุด D. ควรห้ามเครื่องมือประมงทั่วโลก เฉลย: A", "options": ["A. Plastic pollution is a widespread problem with serious impacts and requires global action.", "B. The Great Pacific Garbage Patch is the only polluted area.", "C. Coral reefs are the most important ecosystem.", "D. Fishing gear should be banned worldwide."], "answerIndex": 0, "answerText": "A. Plastic pollution is a widespread problem ; with serious impacts and requires global action.", "randomized": false}]}, {"index": 12, "title": "#14 · 47_Reading_Origins of Paper Money (2026-06-21)", "type": "Reading", "questions": [{"qEn": "1. The word \"instinctive\" is closest in meaning to", "qTh": "1. คําว่า “instinctive” ใกล้เคียงที่สุดกับ A. ชั่วคราว B. เป็นธรรมชาติ C. เทียม D. แพง เฉลย: B. เป็นธรรมชาติ", "options": ["A. temporary", "B. natural", "C. artificial", "D. expensive"], "answerIndex": 1, "answerText": "B. natural", "randomized": false}, {"qEn": "2. The word \"burdensome\" is closest in meaning to", "qTh": "2. คําว่า “burdensome” ใกล้เคียงที ating to rural villages", "B. To demonstrate how entertainment replaced formal education", "C. A sudden decline in urban population caused by severe droughts", "D. It features the premier of an original piece of music."], "answerIndex": 3, "answerText": "D. It features the premier of an original piece of music.", "randomized": true}, {"qEn": "2. According to paragraph 3, some people believed that sound in films would not achieve popularity because", "qTh": "2. ตามย่อหน้า 3 บางคนเชื่อว่าเสียงในภาพยนตร์จะไม่เป็นที่นิยมเพราะ… (ต้นฉบับไม่มีตัวเลือกและเฉลย — เนื้อหาระบุว่าคุณภาพบันทึกแย่และซิงก์เสียงกับภาพไม่ได้)", "options": ["A. early attempts produced poor results", "B. It was primarily developed for military purposes during the 19th century", "C. To compare ancient religious rituals with modern legal systems", "D. A temporary shortage of raw materials in European markets"], "answerIndex": 0, "answerText": "A. early attempts produced poor results", "randomized": true}, {"qEn": "3. The word 'they' in paragraph 3 refers to:", "qTh": "3. คําว่า 'they' ในย่อหน้า 3 หมายถึงอะไร (ต้นฉบับไม่มีตัวเลือกและเฉลย — จากบริบทหมายถึง filmmakers ผู้สร้างภาพยนตร์ที่ทดลองใช้เสียง)", "options": ["A. obscure", "B. invisible", "C. filmmakers", "D. superficial"], "answerIndex": 2, "answerText": "C. filmmakers", "randomized": true}, {"qEn": "4. Examine the four █ in the selection below and indicate at which block the following sentence could be inserted into the passage: Many of these emerging companies not only competed but also collaborated to grow the broadcasting industry in the states. █ [A] The phone was being developed in this era, and wireless technologies began to surface. █ [B] In the United States, firms like the American Telephone and Telegraph (AT&T) and General Electric (GE) emerged as industry leaders, as they pursued new forms of sound technology and all potential avenues for commercial exploitation. █ [C] Commercial radio programming began, spawning an entirely new outlet for entertainment and news. █ [D] Clearly, the world was enjoying the newfound success in sound technology, and it was only a matter of time before the film industry caught up.", "qTh": "4. ดูช่อง █  สี่ช่องในข้อความ แล้วระบุว่าควรแทรกประโยคต่อไปนี้ที่ช่องใด “หลายบริษัทที่เพิ่งเกิดเหล่านี้ไม่เพียง แข่งขันแต่ยังร่วมมือกันขยายอุตสาหกรรมกระจายเสียงในสหรัฐฯ” (ต้นฉบับไม่มีเฉลย)", "options": ["A. They require expensive equipment that is rarely accessible to the public", "B. [C]", "C. It allows modern industries to operate without any electricity", "D. To emphasize the financial benefits of migrating to rural villages"], "answerIndex": 1, "answerText": "B. [C]", "randomized": true}, {"qEn": "5. In paragraph 4, what does the author mean by “it was only a matter of time”?", "qTh": "5. ในย่อหน้า 4 ผู้เขียนหมายความว่าอย่างไรด้วย “it was only a matter of time” เฉลย: ภาพยนตร์จะนําเสียงมาใช้อย่างแน่นอน", "options": ["A. Film’s adoption of sound was certain to happen.", "B. A sudden decline in urban population caused by severe droughts", "C. By encouraging governments to eliminate public education funding", "D. To demonstrate how entertainment replaced formal education"], "answerIndex": 0, "answerText": "A. Film’s adoption of sound was certain to happen.", "randomized": true}, {"qEn": "6. All of the following are true about the film The Jazz Singer EXCEPT", "qTh": "6. ข้อใดต่อไปนี้เป็นจริงเกี่ยวกับภาพยนตร์ The Jazz Singer ยกเว้น (ต้นฉบับไม่มีตัวเลือกและเฉลย)", "options": ["A. They are unaffected by changes in global temperature or climate", "B. It allows modern industries to operate without any electricity", "C. It was released in Europe and the U.S. at the same time.", "D. It was primarily developed for military purposes during the 19th century"], "answerIndex": 2, "answerText": "C. It was released in Europe and the U.S. at the same time.", "randomized": true}, {"qEn": "7. According to paragraph 5, what is the significance of the film Beggars of Life?", "qTh": "7. ตามย่อหน้า 5 ภาพยนตร์ Beggars of Life มีความสําคัญอย่างไร เฉลย: (ต้นฉบับระบุเพียง “Warner Bros.” ซึ่งไม่ใช่คําตอบที่ตรงโจทย์ — จากเนื้อหา คือเป็นภาพยนตร์เสียงเรื่อง แรกของพาราเมาท์ เดือนกันยายน 1928)", "options": ["A. It was primarily developed for military purposes during the 19th century", "B. It was the first full-length sound film released by a studio other than ; Warner Bros.", "C. To demonstrate how entertainment replaced formal education", "D. To emphasize the financial benefits of migrating to rural villages"], "answerIndex": 1, "answerText": "B. It was the first full-length sound film released by a studio other than ; Warner Bros.", "randomized": true}, {"qEn": "8. The word 'embraced' in paragraph 6 is closest in meaning to:", "qTh": "8. คําว่า 'embraced' ในย่อหน้า 6 ใกล้เคียงที่สุดกับ (ต้นฉบับไม่มีตัวเลือกและเฉลย — น่าจะหมายถึง accepted/adopted ยอมรับ)", "options": ["A. artificial", "B. adopted", "C. controversial", "D. dangerous"], "answerIndex": 1, "answerText": "B. adopted", "randomized": true}, {"qEn": "9. Which of the following best expresses the essential information in the highlighted sentence? Incorrect answer choices change the meaning in important ways or leave out essential information. And it wasn’t only studios that lagged behind the filmmakers; conversion of theaters happened somewhat slowly, which meant that many European filmmakers created two versions of each movie: one with sound, one without.", "qTh": "9. ประโยคที่ไฮไลต์ข้อใดสื่อสาระสําคัญได้ดีที่สุด “ไม่ใช่เฉพาะสตูดิโอที่ตามหลัง การปรับโรงภาพยนตร์ก็ช้า ผู้ สร้างภาพยนตร์ยุโรปจึงทําสองเวอร์ชัน คือมีเสียงและไม่มีเสียง” เฉลย: ผู้สร้างภาพยนตร์ยุโรปต้องทําเวอร์ชันไม่มีเสียงของภาพยนตร์เสียงที่ทําในสหรัฐฯ ต่อไป เพราะโรง ภาพยนตร์ยุโรปปรับเข้าสู่เทคโนโลยีเสียงช้า", "options": ["A. By reducing the overall cost of international trade and shipping", "B. To demonstrate how entertainment replaced formal education", "C. It increases the risk of soil erosion and water contamination", "D. Filmmakers in Europe had to continue creating a non-sound version of the ; sound movies they made in the U.S. because European theaters were slow to ; convert to sound technology."], "answerIndex": 3, "answerText": "D. Filmmakers in Europe had to continue creating a non-sound version of the ; sound movies they made in the U.S. because European theaters were slow to ; convert to sound technology.", "randomized": true}, {"qEn": "10. Directions: An introductory sentence for a brief summary of the passage is provided below. Complete the summary by selecting the THREE answer choices that express the most important ideas in the passage. Some sentences do not belong in the summary because they express ideas that are not presented in the passage or are minor ideas in the passage. This question is worth 2 points. Drag your answer choices to the spaces where they belong. To remove an answer choice, drag it back. To review the passage, click VIEW TEXT. A major change in the film industry came in the early 20th century when sound was added to movies.", "qTh": "10. คําถามสรุป: ประโยคนํา “การเปลี่ยนแปลงใหญ่ในอุตสาหกรรมภาพยนตร์เกิดขึ้นในต้นศตวรรษที่ 20 เมื่อมี การเพิ่มเสียงให้ภาพยนตร์” เลือก 3 ข้อที่แสดงใจความสําคัญ (2 คะแนน) A. บริษัทอเมริกันที่เติบโต เช่น AT&T และ GE ช่วยให้ภาพยนตร์เสียงเป็นที่นิยมทั่วสหรัฐฯ B. ก่อนยุค talkies ภาพยนตร์ใช้เสียงผ่านดนตรีสดและการเล่าเรื่อง C. วอร์เนอร์ บราเธอร์สเป็นสตูดิโอแรกที่ออกภาพยนตร์เสียงเรื่องยาว D. ผู้สร้างภาพยนตร์พัฒนาเสียงอย่างต่อเนื่อง ได้ประโยชน์จากเทคโนโลยีเสียงด้านอื่น E. ปลายทศวรรษ 1920 ภาพยนตร์เสียงเป็นที่ยอมรับกว้างขวางในสหรัฐฯ และยุโรปเกือบทั้งหมด เฉลย: B, D, E", "options": ["A. B, D, E ; A. Growing American companies such as AT&T and GE helped to popularize sound ; movies throughout the United States. ; B. Before the “talkies,” movies incorporated sound through live music and ; narration. ; C. Warner Bros. was the first studio to release a feature-length sound movie. ; D. Filmmakers persistently improved sound in film, benefitting from advances in ; other areas of sound technology. ; E. By the end of the 1920s, sound films had become widely accepted in the ; United States and most of Europe.", "B. They rely exclusively on manual labor and simple wooden tools", "C. They are unaffected by changes in global temperature or climate", "D. It increases the risk of soil erosion and water contamination"], "answerIndex": 0, "answerText": "A. B, D, E ; A. Growing American companies such as AT&T and GE helped to popularize sound ; movies throughout the United States. ; B. Before the “talkies,” movies incorporated sound through live music and ; narration. ; C. Warner Bros. was the first studio to release a feature-length sound movie. ; D. Filmmakers persistently improved sound in film, benefitting from advances in ; other areas of sound technology. ; E. By the end of the 1920s, sound films had become widely accepted in the ; United States and most of Europe.", "randomized": true}]}, {"index": 23, "title": "#27 · TOEFL Reading_Gravitational waves (2026-06-21)", "type": "Reading", "questions": [{"qEn": "1. Who was the first person to propose the concept of gravitational waves?", "qTh": "1. ใครเป็นคนแรกที่เสนอแนวคิดคลื่นความโน้มถ่วง A. ไอน์สไตน์ B. โอลิเวอร์ เฮวิไซด์ C. อองรี ปวงกาเร D. โจเซฟ เทย์เลอร์ เฉลย: B", "options": ["A. Albert Einstein", "B. Oliver Heaviside", "C. Henri Poincaré", "D. Joseph Taylor"], "answerIndex": 1, "answerText": "B. Oliver Heaviside", "randomized": false}, {"qEn": "2. According to the passage, in what year did Henri Poincaré suggest gravitational waves?", "qTh": "2. ตามบทความ อองรี ปวงกาเรเสนอคลื่นความโน้มถ่วงในปีใด A. 1893 B. 1905 C. 1916 D. 1974 เฉลย: B", "options": ["A. 1893", "B. 1905", "C. 1916", "D. 1974"], "answerIndex": 1, "answerText": "B. 1905", "randomized": false}, {"qEn": "3. What did Einstein predict in 1916 based on his general theory of relativity?", "qTh": "3. ไอน์สไตน์ทํานายอะไรในปี 1916 จากทฤษฎีสัมพัทธภาพทั่วไป A. การค้นพบพัลซาร์ B. ระลอกคลื่นในกาลอวกาศ C. การรวมตัวของหลุมดํา D. รางวัลโนเบลของนักฟิสิกส์ เฉลย: B", "options": ["A. The discovery of pulsars", "B. Ripples in spacetime", "C. Black hole mergers", "D. Nobel Prizes for physicists"], "answerIndex": 1, "answerText": "B. Ripples in spacetime", "randomized": false}, {"qEn": "4. Why does Newton’s law of gravitation fail to account for gravitational waves?", "qTh": "4. เหตุใดกฎโน้มถ่วงของนิวตันจึงอธิบายคลื่นความโน้มถ่วงไม่ได้ A. สมมติว่าแรงโน้มถ่วงอ่อนเกินกว่าจะสร้างคลื่น B. ใช้ได้เฉพาะระบบดาวคู่ C. สมมติว่าปฏิสัมพันธ์เกิดขึ้นทันที D. ใช้กับหลุมดําไม่ได้ เฉลย: C", "options": ["A. It assumes gravity is too weak to produce waves", "B. It only applies to binary star systems", "C. It assumes interactions happen instantaneously", "D. It does not apply to black holes"], "answerIndex": 2, "answerText": "C. It assumes interactions happen instantaneously", "randomized": false}, {"qEn": "5. Which discovery provided the first indirect evidence for gravitational waves?", "qTh": "5. การค้นพบใดให้หลักฐานทางอ้อมแรกของคลื่นความโน้มถ่วง A. การตรวจจับของ LIGO ปี 2015 B. แบบจําลองการรวมหลุมดํา C. การลดลงของวงโคจรพัลซาร์คู่ฮัลส์–เทย์ เลอร์ D. การสังเกตบิกแบง เฉลย: C", "options": ["A. LIGO detections in 2015", "B. Black hole merger simulations", "C. The orbital decay of the Hulse–Taylor binary pulsar", "D. Observations of the Big Bang"], "answerIndex": 2, "answerText": "C. The orbital decay of the Hulse–Taylor binary pulsar", "randomized": false}, {"qEn": "6. Who received the 1993 Nobel Prize in Physics for confirming indirect evidence of gravitational waves?", "qTh": "6. ใครได้รับรางวัลโนเบลฟิสิกส์ปี 1993 จากการยืนยันหลักฐานทางอ้อมของคลื่นความโน้มถ่วง A. ไวส์ ธอร์น แบริช B. เฮวิไซด์และปวงกาเร C. รัสเซลล์ ฮัลส์ และโจเซฟ เทย์เลอร์ D. ไอน์สไตน์ เฉลย: C", "options": ["A. Rainer Weiss, Kip Thorne, Barry Barish", "B. Oliver Heaviside and Henri Poincaré", "C. Russell Hulse and Joseph Taylor", "D. Albert Einstein"], "answerIndex": 2, "answerText": "C. Russell Hulse and Joseph Taylor", "randomized": false}, {"qEn": "7. When were gravitational waves first directly observed?", "qTh": "7. สังเกตคลื่นความโน้มถ่วงโดยตรงครั้งแรกเมื่อใด A. 1916 B. 1974 C. 1993 D. 2015 เฉลย: D", "options": ["A. 1916", "B. 1974", "C. 1993", "D. 2015"], "answerIndex": 3, "answerText": "D. 2015", "randomized": false}, {"qEn": "8. Which instrument was responsible for the first direct detection of gravitational waves?", "qTh": "8. เครื่องมือใดตรวจจับคลื่นความโน้มถ่วงโดยตรงเป็นครั้งแรก A. กล้องฮับเบิล B. LIGO C. ยานวอยเอเจอร์ D. กล้องจันทรา เฉลย: B", "options": ["A. Hubble Space Telescope", "B. LIGO", "C. Voyager Probe", "D. Chandra X-ray Observatory"], "answerIndex": 1, "answerText": "B. LIGO", "randomized": false}, {"qEn": "9. What event produced the first direct detection of gravitational waves in 2015?", "qTh": "9. เหตุการณ์ใดทําให้ตรวจจับคลื่นความโน้มถ่วงโดยตรงได้ครั้งแรกในปี 2015 A. ซูเปอร์โนวา B. พัลซาร์ยุบตัว C. หลุมดําสองหลุมรวมกัน D. บิกแบง เฉลย: C", "options": ["A. A supernova explosion", "B. A pulsar collapse", "C. A merger of two black holes", "D. The Big Bang"], "answerIndex": 2, "answerText": "C. A merger of two black holes", "randomized": false}, {"qEn": "10. Who received the Nobel Prize in Physics in 2017 for contributions to gravitational-wave detection?", "qTh": "10. ใครได้รับรางวัลโนเบลฟิสิกส์ปี 2017 จากผลงานตรวจจับคลื่นความโน้มถ่วง A. ฮัลส์และเทย์เลอร์ B. เฮวิไซด์และปวงกาเร C. ไวส์ ธอร์น และแบริช D. ไอน์สไตน์และนิวตัน เฉลย: C", "options": ["A. Hulse and Taylor", "B. Heaviside and Poincaré", "C. Weiss, Thorne, and Barish", "D. Einstein and Newton"], "answerIndex": 2, "answerText": "C. Weiss, Thorne, and Barish", "randomized": false}, {"qEn": "11. Which of the following is NOT listed as a source studied in gravitational-wave astronomy?", "qTh": "11. ข้อใดไม่ได้ระบุว่าเป็นแหล่งที่ศึกษาในดาราศาสตร์คลื่นความโน้มถ่วง A. ระบบดาวคู่ B. ซูเปอร์โนวา C. เอกภพยุคแรก D. วงโคจรของดาวเคราะห์ เฉลย: D", "options": ["A. Binary star systems", "B. Supernovae", "C. The early universe", "D. Planetary orbits"], "answerIndex": 3, "answerText": "D. Planetary orbits", "randomized": false}, {"qEn": "12. What is the primary significance of gravitational- wave astronomy?", "qTh": "12. ความสําคัญหลักของดาราศาสตร์คลื่นความโน้มถ่วงคืออะไร A. วัดนํ้าหนักของดาว B. ทําให้ศึกษาเหตุการณ์จักรวาลที่ตรวจจับไม่ได้ด้วยวิธีอื่น C. มาแทนที่ดาราศาสตร์แม่ เหล็กไฟฟ้า D. หักล้างทฤษฎีสัมพัทธภาพของไอน์สไตน์ เฉลย: B", "options": ["A. It measures the weight of stars", "B. It allows the study of cosmic events otherwise undetectable ✔", "C. It replaces electromagnetic astronomy", "D. It disproves Einstein’s relativity"], "answerIndex": 1, "answerText": "B", "randomized": false}]}, {"index": 24, "title": "#28 · Reading_Coral Reefs (2026-06-21)", "type": "Reading", "questions": [{"qEn": "1. The word 'shelter' in paragraph 2 is closest in meaning to:", "qTh": "1. คําว่า “shelter” ในย่อหน้า 2 ใกล้เคียงที่สุดกับ (A) อันตราย (B) การปกป้อง (C) มลพิษ (D) การสํารวจ [ต้นฉบับไม่ระบุเฉลยชัด — ตรวจจากเนื้อหา: B]", "options": ["A. Danger", "B. Protection", "C. Pollution", "D. Exploration"], "answerIndex": 1, "answerText": "(B) Protection – 'Shelter' means a safe place or protection.", "randomized": false}, {"qEn": "2. The word 'addition' is closest in meaning to:", "qTh": "2. คําว่า “addition” ใกล้เคียงที่สุดกับ (A) การเชื่อมต่อ (B) การเพิ่มขึ้น (C) ข้อยกเว้น (D) ตัวอย่าง [ตรวจจากเนื้อหา: B — ต้นฉบับมีหมายเหตุ “to an increase.”]", "options": ["A. Connection", "B. Increase", "C. Exception", "D. Example"], "answerIndex": 1, "answerText": "(B) Increase – 'Addition' means something added, similar", "randomized": false}, {"qEn": "3. According to paragraph 1, coral reefs are called 'the rainforests of the sea' because they —", "qTh": "3. ตามย่อหน้า 1 แนวปะการังถูกเรียกว่า “ป่าฝนแห่งท้องทะเล” เพราะ (A) เติบโตใกล้ป่าเขตร้อน (B) มีความหลากหลายทางชีวภาพสูง (C) อยู่ในเขตชายฝั่งที่ฝนตก (D) พบเฉพาะนํ้า ตื้น [ต้นฉบับมีหมายเหตุ “Reefs are compared to rainforests for this reason.” — เฉลย B]", "options": ["A. grow near tropical forests", "B. ัจจุบัน C. การแสดงริม ถนนผสมประเพณีเก่ากับการปรับตัวสมัยใหม่ ✔  D. ทางการเมืองต้องการกําจัดการแสดงริมถนนทั้งหมด", "options": ["A. Busking is an ancient practice that has not changed", "B. Street performance has disappeared in modern times", "C. Busking combines old traditions with modern adaptations ✔", "D. City authorities want to eliminate busking entirely"], "answerIndex": 0, "answerText": "A. Busking is an ancient practice that has not changed", "randomized": false}, {"qEn": "9. What was one purpose of busking in earlier times?", "qTh": "9. จุดประสงค์อย่างหนึ่งของการแสดงริมถนนในอดีตคืออะไร A. สร้างประสบการณ์ร่วมของชุมชน ✔  B. แทนที่การแสดงละคร C. โปรโมตนโยบายรัฐบาล D. โฆษณาร้านค้า", "options": ["A. To create shared community experiences", "B. To replace theater performances", "C. To promote government policies", "D. To advertise shops and businesses"], "answerIndex": 0, "answerText": "A. To create shared community experiences", "randomized": false}, {"qEn": "10. According to the passage, what is a benefit of modern busking?", "qTh": "10. ตามบทความ ประโยชน์ของการแสดงริมถนนสมัยใหม่คืออะไร A. รายได้สูงที่การันตี B. ติดต่อกับผู้ชมได้ทันที ✔  C. ปกป้องจากการแข่งขัน D. การสนับสนุนจากผู้สนับสนุน ทางการ", "options": ["A. Guaranteed high income", "B. Instant audience connection", "C. Protection from competition", "D. Support from official sponsors"], "answerIndex": 1, "answerText": "B. Instant audience connection", "randomized": false}, {"qEn": "11. Which of the following is listed as a purpose of creating busking zones? (Choose TWO) • To reduce safety concerns ✔ • To promote tourism ✔ • To restrict cultural growth", "qTh": "11. ข้อใดระบุเป็นจุดประสงค์ของการสร้างพื้นที่แสดงริมถนน (เลือก 2) • เพื่อลดปัญหาความปลอดภัย ✔  • เพื่อส่งเสริมการท่องเที่ยว ✔  • เพื่อจํากัดการเติบโตทางวัฒนธรรม", "options": ["A. They were originally designed for royal ceremonies and banquets", "B. A temporary shortage of raw materials in European markets", "C. Refer to the passage details", "D. It occurs only in regions with extreme polar weather conditions"], "answerIndex": 2, "answerText": "C. Refer to the passage details", "randomized": true}, {"qEn": "12. Which of the following is mentioned as a challenge of busking? (Choose TWO) • Lack of clear rules ✔ • Intense competition ✔ • Expensive permits for theaters", "qTh": "12. ข้อใดกล่าวถึงเป็นความท้าทายของการแสดงริมถนน (เลือก 2) • ขาดกฎที่ชัดเจน ✔  • การแข่งขันรุนแรง ✔  • ใบอนุญาตโรงละครแพง", "options": ["A. Refer to the passage details", "B. It prevents researchers from gathering accurate historical records", "C. It has no measurable effect on human health or cognitive ability", "D. By reducing the overall cost of international trade and shipping"], "answerIndex": 0, "answerText": "A. Refer to the passage details", "randomized": true}]}, {"index": 26, "title": "#30 · TOEFL Reading _ Artificial Intelligence in Modern Medicine (2026-06-21)", "type": "Reading", "questions": [{"qEn": "1.According to the passage, what advantage do AI systems provide in analyzing medical images?", "qTh": "1. ตามบทความ ระบบ AI ให้ข้อได้เปรียบอะไรในการวิเคราะห์ภาพทางการแพทย์ a) ไม่ต้องใช้รังสีแพทย์ b) ตรวจจับรูปแบบที่แพทย์อาจมองข้ามได้ c) ลดต้นทุนการวินิจฉัย d) ป้องกันผู้ป่วยได้รับ รังสี เฉลย: b", "options": ["A. They eliminate the need for trained radiologists", "B. They can detect patterns that might be missed by human clinicians", "C. They reduce the cost of diagnostic procedures", "D. They prevent patients from being exposed to radiation"], "answerIndex": 1, "answerText": "b.", "randomized": false}, {"qEn": "2.The passage suggests that the most effective approach to medical diagnosis involves:", "qTh": "2. บทความชี้ว่าแนวทางวินิจฉัยที่ได้ผลที่สุดคือ a) แทนที่วิจารณญาณมนุษย์ด้วย AI b) ใช้ AI เฉพาะโรคหายากหรือซับซ้อน c) ผสมการประเมินของ AI กับ ความเชี่ยวชาญมนุษย์ d) ฝึกแพทย์ให้คิดเหมือนระบบ AI เฉลย: c", "options": ["A. replacing human judgment with AI algorithms", "B. using AI only for rare or complex conditions", "C. combining AI assessments with human expertise", "D. training physicians to think more like AI systems"], "answerIndex": 2, "answerText": "c.", "randomized": false}, {"qEn": "3.In the context of personalized medicine, what capability of AI is highlighted in the passage?", "qTh": "3. ในบริบทการแพทย์เฉพาะบุคคล ความสามารถของ AI ที่เน้นคืออะไร a) ถอดรหัสจีโนมผู้ป่วยได้เร็วขึ้น b) ระบุความสัมพันธ์ข้ามตัวแปรหลายพันตัว c) พัฒนายากลุ่มใหม่ทั้งหมด d) ทําการผ่าตัดเสมือนก่อนผ่าตัดจริง เฉลย: b", "options": ["A. The ability to sequence patients' genomes more quickly", "B. The capacity to identify correlations across thousands of variables", "C. The potential to develop entirely new categories of medications", "D. The capability to perform virtual surgeries before actual procedures"], "answerIndex": 1, "answerText": "b.", "randomized": false}, {"qEn": "4. What specific achievement in pharmaceutical research using AI does the passage mention?", "qTh": "4. ความสําเร็จเฉพาะในการวิจัยเภสัชกรรมด้วย AI ที่บทความกล่าวถึงคืออะไร a) พัฒนาวัคซีนโรคที่เคยรักษาไม่ได้ b) ค้นพบยาปฏิชีวนะใหม่ที่ได้ผลกับแบคทีเรียดื้อยา c) สร้างอัลกอริทึม ทํานายผลข้างเคียงยาแม่นยํา 100% d) ระบุเครื่องหมายพันธุกรรมที่กําหนดประสิทธิผลของยา เฉลย: b", "options": ["A. The development of a vaccine for a previously incurable disease", "B. The discovery of a novel antibiotic effective against resistant bacteria", "C. The creation of an algorithm that can predict drug side effects with 100% accuracy", "D. The identification of genetic markers that determine medication effectiveness"], "answerIndex": 1, "answerText": "b.", "randomized": false}, {"qEn": "5. According to the passage, why might historical biases in medical research be problematic for AI systems?", "qTh": "5. ตามบทความ เหตุใดอคติเชิงประวัติศาสตร์ในงานวิจัยการแพทย์จึงเป็นปัญหาของ AI a) อาจถูกส่งต่อหรือขยายโดยอัลกอริทึมที่ฝึกจากข้อมูลมีอคติ b) อาจทําให้ AI ปฏิเสธความรู้การแพทย์แบบเดิม c) ขัดขวางไม่ให้ AI พัฒนาแนวทางนวัตกรรมจริง d) นําไปสู่ความระมัดระวังเกินไปในคําแนะนํา เฉลย: a", "options": ["A. They could be perpetuated or amplified by algorithms trained on biased data", "B. They might cause AI systems to reject traditional medical knowledge", "C. They would prevent AI from developing truly innovative approaches", "D. They could lead to excessive caution in AI-generated recommendations"], "answerIndex": 0, "answerText": "a.", "randomized": false}, {"qEn": "6.The passage describes many AI systems as \"black boxes\" because:", "qTh": "6. บทความอธิบายว่าระบบ AI หลายระบบเป็น “กล่องดํา” เพราะ a) ถูกปิดผนึกทางกายภาพเพื่อปกป้องเทคโนโลยี b) กระบวนการตัดสินใจตีความได้ยาก c) ทํางานโดยไม่มีการ กํากับดูแล d) เก็บข้อมูลแพทย์ในรูปแบบเข้ารหัสที่เข้าถึงไม่ได้ เฉลย: b", "options": ["A. they are physically sealed to protect proprietary technology", "B. their decision-making processes are not easily interpreted", "C. they operate without human supervision or oversight", "D. they store medical data in encrypted, inaccessible formats"], "answerIndex": 1, "answerText": "b.", "randomized": false}, {"qEn": "7.Based on the passage, which of the following best describes the author's view of AI's role in healthcare?", "qTh": "7. ตามบทความ ข้อใดอธิบายมุมมองของผู้เขียนต่อบทบาทของ AI ในการดูแลสุขภาพได้ดีที่สุด a) AI จะแทนที่แพทย์ส่วนใหญ่ในที่สุด b) AI ควรจํากัดอยู่ที่งานธุรการไม่ใช่งานคลินิก c) AI จะมีบทบาทเสริม เพิ่มความสามารถมนุษย์ d) AI เป็นกระแสชั่วคราวที่จะลดลงเมื่อข้อจํากัดชัดเจน เฉลย: c", "options": ["A. AI will eventually replace most human physicians", "B. AI should be limited to administrative rather than clinical applications", "C. AI will serve a complementary role, augmenting human capabilities", "D. AI represents a temporary trend that will diminish as its limitations become apparent"], "answerIndex": 2, "answerText": "c.", "randomized": false}, {"qEn": "8.Which of the following is NOT mentioned in the passage as a challenge in implementing AI in healthcare?", "qTh": "8. ข้อใดไม่ได้กล่าวถึงเป็นความท้าทายในการใช้ AI ในการแพทย์ a) การรับรองคุณภาพและความเป็นตัวแทนของข้อมูลฝึก b) การแก้ความทึบของกระบวนการตัดสินใจของ AI c) การจัดการต้นทุนสูงของระบบ AI เทียบกับแรงงานมนุษย์ d) การพัฒนากรอบกฎระเบียบและนโยบายที่เหมาะสม เฉลย: c", "options": ["A. Ensuring the quality and representativeness of training data", "B. Addressing the opacity of AI decision-making processes", "C. Managing the high cost of AI systems compared to human labor", "D. Developing appropriate regulatory and policy frameworks"], "answerIndex": 2, "answerText": "c.", "randomized": false}, {"qEn": "9.The passage implies that successful integration of AI into healthcare will require:", "qTh": "9. บทความบอกเป็นนัยว่าการนํา AI เข้าสู่การแพทย์สําเร็จจะต้องมี a) ผู้ป่วยมีความรู้ด้านเทคโนโลยีมากขึ้น b) แพทย์ยอมสละอํานาจทางคลินิกให้ระบบอัตโนมัติ c) การพิจารณา ด้านจริยธรรมและการศึกษาอย่างรอบคอบ d) การปรับโครงสร้างสถาบันและแนวปฏิบัติทางการแพทย์ทั้งหมด เฉลย: c", "options": ["A. patients to become more technologically sophisticated", "B. physicians to surrender clinical authority to automated systems", "C. thoughtful consideration of ethical and educational implications", "D. complete restructuring of medical institutions and practices"], "answerIndex": 2, "answerText": "c.", "randomized": false}, {"qEn": "10.Which conclusion about the relationship between AI and medical professionals is best supported by the passage?", "qTh": "10. ข้อสรุปใดเกี่ยวกับความสัมพันธ์ระหว่าง AI กับบุคลากรทางการแพทย์ได้รับการสนับสนุนดีที่สุดจากบทความ a) AI จะเป็นประโยชน์ต่อผู้เชี่ยวชาญเฉพาะทางมากกว่าแพทย์ทั่วไป b) บุคลากรทางการแพทย์ต้องพัฒนาทักษะ ใหม่เพื่อทํางานกับ AI อย่างมีประสิทธิภาพ c) แพทย์รุ่นใหม่ปรับตัวกับ AI ได้ง่ายกว่าแพทย์มีประสบการณ์ d) ผู้ ป่วยจะชอบการวินิจฉัยของ AI มากกว่ามนุษย์ เฉลย: b A. Personalized learning systems B. Job displacement in repetitive industries C. Ethical concerns such as bias in decision-making D. AI analyzes medical images with high accuracy E. Governments creating regulations to manage AI F. Misuse of personal data G. AI is a technology that allows machines to learn from data H. AI helps recommend entertainment content ✔ D. AI analyzes medical images with high ข้อเสริม (จับคู่/ลากวาง ส่วนท้ายไฟล์) A. ระบบการเรียนรู้เฉพาะบุคคล B. การแทนที่งานในอุตสาหกรรมซํ้าๆ C. ข้อกังวลด้านจริยธรรม เช่น อคติใน การตัดสินใจ D. AI วิเคราะห์ภาพทางการแพทย์ได้แม่นยําสูง E. รัฐบาลออกกฎระเบียบเพื่อควบคุม AI F. การใช้ ข้อมูลส่วนบุคคลผิดวัตถุประสงค์ G. AI เป็นเทคโนโลยีที่ให้เครื่องจักรเรียนรู้จากข้อมูล H. AI ช่วยแนะนําเนื้อหา ความบันเทิง เครื่องหมายเฉลยในไฟล์: ✔  D. AI วิเคราะห์ภาพทางการแพทย์ได้แม่นยําสูง (ข้อความในไฟล์ต้นฉบับตัดท้าย)", "options": ["A. AI will primarily benefit specialists rather than general practitioners", "B. Medical professionals will need to develop new skills to work effectively with AI", "C. Younger physicians will adapt to AI more readily than experienced clinicians", "D. Patients will increasingly prefer AI diagnosis over human physician assessment"], "answerIndex": 1, "answerText": "b.", "randomized": false}]}, {"index": 27, "title": "#31 · TOEFL Reading Passage- The Great Wall of China (2026-06-21)", "type": "Reading", "questions": [{"qEn": "1. According to the passage, why was the Great Wall initially built?", "qTh": "1. ตามบทความ กําแพงเมืองจีนถูกสร้างครั้งแรกเพื่ออะไร A. เป็นสถานที่ท่องเที่ยว B. ตรวจสอบการค้าบนเส้นทางสายไหม C. ปกป้องจีนจากการรุกรานทางเหนือ ✔  D. เชื่อมเมืองต่างๆ", "options": ["A. To serve as a tourist attraction", "B. To monitor trade along the Silk Road", "C. To protect China from northern invasions", "D. To connect different cities"], "answerIndex": 2, "answerText": "C. To protect China from northern invasions", "randomized": false}, {"qEn": "2. What does paragraph 2 emphasize about the construction of the Wall?", "qTh": "2. ย่อหน้า 2 เน้นอะไรเกี่ยวกับการก่อสร้างกําแพง A. ต้องใช้เทคโนโลยีขั้นสูงอย่างเดียว B. ยากลําบากและใช้แรงงานมาก ✔  C. สร้างเสร็จอย่างรวดเร็ว D. มีแต่ ทหารที่เกี่ยวข้อง", "options": ["A. It required advanced technology only", "B. It was difficult and labor-intensive", "C. It was completed quickly", "D. Only soldiers were involved"], "answerIndex": 1, "answerText": "B. It was difficult and labor-intensive", "randomized": false}, {"qEn": "3. In paragraph 3, the word symbolic is closest in meaning to:", "qTh": "3. ในย่อหน้า 3 คําว่า symbolic ใกล้เคียงที่สุดกับ A. ตกแต่ง B. เป็นตัวแทน ✔  C. ใช้งานได้ D. เชิงประวัติศาสตร์", "options": ["A. decorative", "B. representative", "C. functional", "D. historical"], "answerIndex": 1, "answerText": "B. representative", "randomized": false}, {"qEn": "4. Which of the following statements is true about the Great Wall?", "qTh": "4. ข้อใดเป็นจริงเกี่ยวกับกําแพงเมืองจีน A. สร้างในราชวงศ์เดียว B. สร้างโดยคนงานที่ได้ค่าจ้างเท่านั้น C. สร้างตลอดหลายราชวงศ์ ✔  D. ไม่มีอยู่แล้ว", "options": ["A. It was built in a single dynasty", "B. It was constructed only by paid workers", "C. It was built over several dynasties", "D. It no longer exists today"], "answerIndex": 2, "answerText": "C. It was built over several dynasties", "randomized": false}, {"qEn": "5. In paragraph 4, what does it refer to in the sentence “It attracts millions of tourists every year”?", "qTh": "5. ในย่อหน้า 4 คําว่า It ในประโยค “It attracts millions of tourists every year” หมายถึงอะไร A. ยูเนสโก B. จีน C. กําแพงเมืองจีน ✔  D. แหล่งมรดกทางวัฒนธรรม", "options": ["A. UNESCO", "B. China", "C. The Great Wall", "D. Cultural heritage site"], "answerIndex": 2, "answerText": "C. The Great Wall", "randomized": false}, {"qEn": "6. What is the main idea of paragraph 1?", "qTh": "6. ใจความสําคัญของย่อหน้า 1 คืออะไร A. กําแพงเป็นสถานที่ท่องเที่ยวที่มีชื่อเสียง B. กําแพงแสดงความมุ่งมั่นของมนุษย์และทักษะวิศวกรรม ✔  C. สร้างกําแพงง่าย D. กําแพงใช้ในการค้า", "options": ["A. The Wall is a famous tourist attraction", "B. The Wall demonstrates human determination and engineering skill ✔", "C. The Wall was easy to build", "D. The Wall was used for trade"], "answerIndex": 0, "answerText": "A. The Wall is a famous tourist attraction", "randomized": false}, {"qEn": "7. nimation", "B. The need to create thousands of images for smooth movement", "C. The inability to add sound to animated films", "D. The difficulty of using computers to assist in animation"], "answerIndex": 1, "answerText": "b ต้องสร้างภาพนับพันเพื่อการเคลื่อนไหวที่ลื่นไหล", "randomized": false}, {"qEn": "7. In which decade did computer animation become more popular?", "qTh": "7. แอนิเมชันคอมพิวเตอร์เป็นที่นิยมมากขึ้นในทศวรรษใด [ตรวจจากเนื้อหา: c ทศวรรษ 1970]", "options": ["A. 1950s", "B. 1960s", "C. 1970s", "D. 1980s"], "answerIndex": 2, "answerText": "c ทศวรรษ 1970", "randomized": false}, {"qEn": "8. What does the phrase \"blending of old methods with new technology\" in the passage mean?", "qTh": "8. วลี “blending of old methods with new technology” ในบทความหมายถึงอะไร [ตรวจจากเนื้อหา: b คงวิธีวาดมือแบบดั้งเดิมพร้อมผสานเครื่องมือคอมพิวเตอร์]", "options": ["A. Completely replacing traditional techniques with modern ones", "B. Keeping traditional hand-drawing methods while integrating computer tools", "C. Only using digital animation for creating animated movies", "D. Ignoring older animation techniques in favor of modern approaches"], "answerIndex": 1, "answerText": "b คงวิธีวาดมือแบบดั้งเดิมพร้อมผสานเครื่องมือคอมพิวเตอร์", "randomized": false}, {"qEn": "9. What does the word \"technique\" in the passage most closely mean?", "qTh": "9. คําว่า “technique” ในบทความใกล้เคียงกับอะไรมากที่สุด [ตรวจจากเนื้อหา: a กลยุทธ์ หรือ d ทักษะ — กํากวม; ในบริบท “วิธีการ” ใกล้ a มากกว่า]", "options": ["A. Strategy", "B. Equipment", "C. Style", "D. Skill"], "answerIndex": 0, "answerText": "a กลยุทธ์ หรือ d ทักษะ — กํากวม; ในบริบท “วิธีการ” ใกล้ a มากกว่า", "randomized": false}, {"qEn": "10. What is the main idea of the final paragraph?", "qTh": "10. ใจความสําคัญของย่อหน้าสุดท้ายคืออะไร [ตรวจจากเนื้อหา: b แอนิเมชันจะพัฒนาต่อไปด้วยนวัตกรรมใหม่]", "options": ["A. Animation techniques are becoming outdated.", "B. Animation will continue evolving with new innovations.", "C. Traditional an ise?", "qTh": "5. ตามย่อหน้า B กิจกรรมภูเขาไฟมีอิทธิพลต่อระดับนํ้าทะเลที่สูงขึ้นอย่างไร เฉลย: C. ละลายนํ้าแข็งที่ไหลลงทะเลเร็วขึ้น", "options": ["A. By producing large amounts of ash in the atmosphere", "B. By releasing gases that cool the climate", "C. By melting ice that flows more rapidly into the sea", "D. By reducing ocean salinity"], "answerIndex": 2, "answerText": "C. By melting ice that flows more rapidly into the sea", "randomized": false}, {"qEn": "6. What is mentioned as a major obstacle in studying Antarctic volcanoes?", "qTh": "6. อะไรเป็นอุปสรรคสําคัญในการศึกษาภูเขาไฟแอนตาร์กติกา เฉลย: C. ชั้นนํ้าแข็งหนาขวางการสังเกตโดยตรง", "options": ["A. Lack of research funding", "B. Inaccurate satellite images", "C. Thick layers of ice blocking direct observation", "D. Rapid volcanic eruptions"], "answerIndex": 2, "answerText": "C. Thick layers of ice blocking direct observation", "randomized": false}, {"qEn": "7. The word “obstacle” in paragraph C could best be replaced by:", "qTh": "7. คําว่า “obstacle” ในย่อหน้า C แทนที่ได้ดีที่สุดด้วย เฉลย: A. challenge (ความท้าทาย)", "options": ["A. challenge", "B. resource", "C. advantage", "D. pathway"], "answerIndex": 0, "answerText": "A. challenge", "randomized": false}, {"qEn": "8. What type of evidence do scientists use to study volcanoes under ice?", "qTh": "8. นักวิทยาศาสตร์ใช้หลักฐานประเภทใดศึกษาภูเขาไฟใต้นํ้าแข็ง เฉลย: B. ข้อมูลแผ่นดินไหวและเรดาร์", "options": ["A. Fossil remains", "B. Seismic and radar data", "C. Underwater cameras", "D. Temperature logs from the ocean"], "answerIndex": 1, "answerText": "B. Seismic and radar data", "randomized": false}, {"qEn": "9. The word “outcomes” in paragraph D is closest in meaning to:", "qTh": "9. คําว่า “outcomes” ในย่อหน้า D ใกล้เคียงที่สุดกับ เฉลย: C. results (ผลลัพธ์)", "options": ["A. problems", "B. obstacles", "C. results", "D. reactions"], "answerIndex": 2, "answerText": "C. results", "randomized": false}, {"qEn": "10. Which of the following best expresses the main idea of paragraph D?", "qTh": "10. ข้อใดแสดงใจความสําคัญของย่อหน้า D ได้ดีที่สุด เฉลย: B. การเข้าใจความร้อนจากภูเขาไฟช่วยคาดการณ์ผลกระทบด้านภูมิอากาศ", "options": ["A. Melting ice has no connection with volcanic activity", "B. Understanding volcanic heat can help predict climate impacts ✔", "C. Policy changes have little effect on global warming", "D. Antarctica’s volcanoes have already stopped erupting"], "answerIndex": 1, "answerText": "B. การเข้าใจความร้อนจากภูเขาไฟช่วยคาดการณ์ผลกระทบด้านภูมิอากาศ", "randomized": false}, {"qEn": "11. What is the relationship between paragraphs B and C? paragraph B.", "qTh": "11. ย่อหน้า B กับ C สัมพันธ์กันอย่างไร เฉลย: A. ย่อหน้า B อธิบายผลของภูเขาไฟ ส่วนย่อหน้า C พูดถึงความยากในการศึกษา", "options": ["A. Paragraph B describes the effects of volcanoes, while paragraph C discusses the difficulties in studying them. ✔", "B. Paragraph B presents theories, and paragraph C provides counter-arguments.", "C. Both paragraphs describe the same process of ice melting.", "D. Paragraph C provides historical evidence for"], "answerIndex": 0, "answerText": "A. ย่อหน้า B อธิบายผลของภูเขาไฟ ส่วนย่อหน้า C พูดถึงความยากในการศึกษา", "randomized": false}, {"qEn": "12. Which of the following best describes the author’s tone?", "qTh": "12. นํ้าเสียงของผู้เขียนเป็นแบบใด เฉลย: B. เชิงวิทยาศาสตร์และให้ข้อมูล Drag & Drop :Obstacle vs Research Outcome Category Sentences Obstacle (a) The thick ice makes direct observation nearly impossible. (b) Instruments often fail in extreme cold. (c) Researchers have limited access to remote Research Outcome (d) Scientists improved models predicting ice melt and sea level rise. (e) The study provided new evidence of hidden volcanoes beneath glaciers. ลากและวาง: อุปสรรคกับผลการวิจัย อุปสรรค: (a) นํ้าแข็งหนาทําให้สังเกตโดยตรงแทบเป็นไปไม่ได้ (b) เครื่องมือมักเสียในที่หนาวจัด (c) นักวิจัยเข้า ถึงพื้นที่ห่างไกลได้จํากัด ผลการวิจัย: (d) นักวิทยาศาสตร์ปรับปรุงแบบจําลองทํานายการละลายของนํ้าแข็งและระดับนํ้าทะเล (e) งาน ศึกษาให้หลักฐานใหม่ของภูเขาไฟที่ซ่อนอยู่ใต้ธารนํ้าแข็ง Insert Sentence Practice Sentence to insert: “This hidden activity could be more widespread than scientists previously believed.” Insert into Paragraph A after the sentence: “These subglacial volcanoes, some still active, generate heat that slowly melts the ice above them.” ✅  Correct placement (makes logical sense and maintains flow): These subglacial volcanoes, some still active, generate heat that slowly melts the ice above them. This hidden activity could be more widespread than scientists previously believed. This hidden geothermal activity has drawn attention because it may influence how quickly Antarctica’s massive ice sheet melts. ฝึกแทรกประโยค ประโยคที่แทรก: “กิจกรรมที่ซ่อนอยู่นี้อาจแพร่หลายกว่าที่นักวิทยาศาสตร์เคยเชื่อ” แทรกในย่อหน้า A หลังประโยค “ภูเขาไฟใต้ธารนํ้าแข็งเหล่านี้ บางลูกยังคุกรุ่น ผลิตความร้อนที่ค่อยๆ ละลายนํ้า แข็งด้านบน” ✅  ตําแหน่งที่ถูก: แทรกต่อจากประโยคนั้นและก่อนประโยค “กิจกรรมความร้อนใต้พิภพที่ซ่อนอยู่นี้ได้รับความ สนใจ…” จึงสมเหตุสมผลและลื่นไหล Vocabulary Focus: Synonyms Word Synonym Thai Meaning obstacle barrier, challenge, hindrance lubricate make smooth, reduce friction คําศัพท์เน้น: คําพ้องความหมาย obstacle (อุปสรรค) — barrier, challenge, hindrance lubricate (หล่อลื่น) — make smooth, reduce friction", "options": ["A. Emotional and persuasive", "B. Scientific and informative", "C. Critical and doubtful", "D. Optimistic and humorous"], "answerIndex": 1, "answerText": "B. Scientific and informative", "randomized": false}]}, {"index": 42, "title": "#46 · 17_Reading_Crop-growing skyscrapers (2026-06-21)", "type": "Reading", "questions": [{"qEn": "1. What percentage of the world's population is expected to live in urban areas by 2050?", "qTh": "1. คาดว่าภายในปี 2050 ประชากรโลกกี่เปอร์เซ็นต์จะอาศัยในเขตเมือง เฉลย: D. 80%", "options": ["A. 50%", "B. 60%", "C. 70%", "D. 80% Key: D"], "answerIndex": 3, "answerText": "D. 80%", "randomized": false}, {"qEn": "2. What is one major advantage of vertical arbarian invasions", "D. Roman engineering had little influence on the modern world"], "answerIndex": 1, "answerText": "B", "randomized": false}, {"qEn": "Question 2: Vocabulary in Context The word “disciplined” in paragraph 1 is closest in meaning to:", "qTh": "ข้อ 2: คําศัพท์ คําว่า “disciplined” ในย่อหน้า 1 ใกล้เคียงที่สุดกับ เฉลย: B. well-organized (มีระเบียบดี)", "options": ["A. aggressive", "B. well-organized", "C. creative", "D. flexible"], "answerIndex": 1, "answerText": "B", "randomized": false}, {"qEn": "Question 3: Detail Question According to the passage, why were roads important to the Roman Empire?", "qTh": "ข้อ 3: รายละเอียด ตามบทความ เหตุใดถนนจึงสําคัญต่อจักรวรรดิโรมัน เฉลย: C. เชื่อมเมืองและทําให้ทหารกับการค้าเคลื่อนที่เร็วขึ้น", "options": ["A. They were used mainly for entertainment", "B. They helped transport water to cities", "C. They connected cities and allowed faster movement of troops and trade", "D. They prevented invasions from neighboring regions"], "answerIndex": 2, "answerText": "C", "randomized": false}, {"qEn": "Question 4: Detail Question What was the main purpose of Roman aqueducts?", "qTh": "ข้อ 4: รายละเอียด จุดประสงค์หลักของท่อส่งนํ้าโรมันคืออะไร เฉลย: B. จัดหานํ้าสําหรับเกษตรและชีวิตประจําวัน", "options": ["A. To protect cities from enemies", "B. To provide water for agriculture and daily life", "C. To support religious ceremonies", "D. To entertain Roman citizens"], "answerIndex": 1, "answerText": "B", "randomized": false}, {"qEn": "Question 5: Reference Question The word “These” in paragraph 2 refers to:", "qTh": "ข้อ 5: การอ้างอิง คําว่า “These” ในย่อหน้า 2 หมายถึง เฉลย: C. ความสําเร็จด้านวิศวกรรม", "options": ["A. Roman citizens", "B. Gladiator contests", "C. Engineering achievements", "D. Barbarian invasions"], "answerIndex": 2, "answerText": "C", "randomized": false}, {"qEn": "Question 6: Not Mentioned Which of the following is NOT mentioned as a reason for the success of the Roman Empire?", "qTh": "ข้อ 6: ไม่ได้กล่าวถึง ข้อใดไม่ได้กล่าวถึงเป็นเหตุผลของความสําเร็จของจักรวรรดิโรมัน เฉลย: D. พันธมิตรทางการทูตอย่างสันติ", "options": ["A. A strong and disciplined army", "B. Expansion through conquering neighboring lands", "C. Advanced infrastructure", "D. Peaceful diplomatic alliances"], "answerIndex": 3, "answerText": "D", "randomized": false}, {"qEn": "Question 7: Insert Sentence Where would the following sentence best fit in paragraph 2? “This allowed Roman cities to grow and function more efficiently.”", "qTh": "ข้อ 7: แทรกประโยค ประโยค “สิ่งนี้ทําให้เมืองโรมันเติบโตและทํางานได้มีประสิทธิภาพขึ้น” เหมาะที่ตําแหน่งใดในย่อหน้า 2 เฉลย: C. หลังประโยคเกี่ยวกับท่อส่งนํ้า", "options": ["A. At the beginning of paragraph 2", "B. After the sentence about roads", "C. After the sentence about aqueducts", "D. At the end of paragraph 3"], "answerIndex": 2, "answerText": "C", "randomized": false}, {"qEn": "Question 8: Inference What can be inferred about the fall of the Roman Empire?", "qTh": "ข้อ 8: การอนุมาน อนุมานอะไรได้เกี่ยวกับการล่มสลายของจักรวรรดิโรมัน เฉลย: C. ความอ่อนแอภายในทําให้จักรวรรดิเปราะบางต่อภัยภายนอก", "options": ["A. It was caused by a single major invasion", "B. It happened suddenly without warning", "C. Internal weaknesses made the empire vulnerable to external threats", "D. Economic growth continued after the fall"], "answerIndex": 2, "answerText": "C", "randomized": false}, {"qEn": "Question 9: Vocabulary in Context The word “declined” in paragraph 3 is closest in meaning to:", "qTh": "ข้อ 9: คําศัพท์ คําว่า “declined” ในย่อหน้า 3 ใกล้เคียงที่สุดกับ เฉลย: B. weakened (อ่อนแอลง)", "options": ["A. expanded", "B. weakened", "C. stabilized", "D. improved"], "answerIndex": 1, "answerText": "B", "randomized": false}, {"qEn": "Question 10: Drag & Drop – Categorization Which of the following belong to each category? Achievements of the Roman Empire (Choose 3): • Construction of roads • Building aqueducts • Development of legal systems Causes of the Empire’s Downfall (Choose 2): • Corruption • Economic difficulties", "qTh": "ข้อ 10: ลากและวาง ความสําเร็จของจักรวรรดิโรมัน (เลือก 3): การสร้างถนน • การสร้างท่อส่งนํ้า • การพัฒนาระบบกฎหมาย สาเหตุของการล่มสลาย (เลือก 2): การทุจริต • ความยากลําบากทางเศรษฐกิจ", "options": ["A. It allows modern industries to operate without any electricity", "B. It has no measurable effect on human health or cognitive ability", "C. To prove that earlier scientific theories were entirely fabricated", "D. Refer to the passage details"], "answerIndex": 3, "answerText": "D. Refer to the passage details", "randomized": true}, {"qEn": "Question 11: Summary Question Select THREE statements that best summarize the passage. ☐ The Roman Empire grew through military strength and disciplined organization ☐ Entertainment was the main reason for Rome’s expansion ☐ Infrastructure such as roads and aqueducts supported Roman society ☐ Corruption and invasions contributed to the empire’s decline ☐ Roman influence completely disappeared after the empire fell ☐ Roman systems continue to affect modern societies", "qTh": "ข้อ 11: สรุป (เลือก 3) เฉลย: • จักรวรรดิโรมันเติบโตด้วยกําลังทหารและการจัดระเบียบที่มีวินัย • โครงสร้างพื้นฐานอย่างถนนและท่อ ส่งนํ้าสนับสนุนสังคมโรมัน • การทุจริตและการรุกรานมีส่วนทําให้จักรวรรดิเสื่อมลง", "options": ["A. They were originally designed for royal ceremonies and banquets", "B. • The Roman Empire grew through military strength and ; disciplined organization ; • Infrastructure such as roads and aqueducts supported ; Roman society ; • Corruption and invasions contributed to the empire’s ; decline", "C. By encouraging governments to eliminate public education funding", "D. To demonstrate how entertainment replaced formal education"], "answerIndex": 1, "answerText": "B. • The Roman Empire grew through military strength and ; disciplined organization ; • Infrastructure such as roads and aqueducts supported ; Roman society ; • Corruption and invasions contributed to the empire’s ; decline", "randomized": true}]}, {"index": 44, "title": "#52 · 1_TOEFL Reading_Polar animals (2026-05-11)", "type": "Reading", "questions": [{"qEn": "1. The word compact in the paragraph is closest in meaning to:", "qTh": "1. คําว่า compact ในย่อหน้า ใกล้เคียงที่สุดกับ เฉลย (ตามต้นฉบับภาษาไทยในไฟล์): หนาแน่น (dense)", "options": ["A. unusual", "B. secondary", "C. (from the Thai key in the file): compact = dense ( หนาแน่น )", "D. accidental"], "answerIndex": 2, "answerText": "C. (from the Thai key in the file): compact = dense ( หนาแน่น )", "randomized": true}, {"qEn": "2. What is the reason that penguins expel concentrated brine?", "qTh": "2. เหตุใดเพนกวินจึงขับนํ้าเกลือเข้มข้นออกมา เฉลย: เนื่องจากขาดนํ้าจืด", "options": ["A. They rely exclusively on manual labor and simple wooden tools", "B. (from the Thai key in the file): Because of the lack of fresh water", "C. It allows modern industries to operate without any electricity", "D. To compare ancient religious rituals with modern legal systems"], "answerIndex": 1, "answerText": "B. (from the Thai key in the file): Because of the lack of fresh water", "randomized": true}, {"qEn": "3. In the paragraph, the author states that penguins expel sea water through their nostrils as an adaptation. What purpose did the author have for using this special example?", "qTh": "3. ผู้เขียนระบุว่าเพนกวินขับนํ้าทะเลออกทางจมูกเพื่อปรับตัว ผู้เขียนใช้ตัวอย่างพิเศษนี้เพื่อจุดประสงค์ใด เฉลย: เพื่อสร้างความตระหนักรู้เรื่องการขาดแคลนนํ้าจืดในแอนตาร์กติกา (ตามต้นฉบับ)", "options": ["A. A sudden decline in urban population caused by severe droughts", "B. To emphasize the financial benefits of migrating to rural villages", "C. (from the Thai key in the file): To raise awareness of the shortage of fresh water in Antarctica", "D. They were originally designed for royal ceremonies and banquets"], "answerIndex": 2, "answerText": "C. (from the Thai key in the file): To raise awareness of the shortage of fresh water in Antarctica", "randomized": true}, {"qEn": "4. According to the paragraph, in what century did humans start living in the Antarctic?", "qTh": "4. มนุษย์เริ่มอาศัยในแอนตาร์กติกาเมื่อศตวรรษใด เฉลย: ศตวรรษที่ 20", "options": ["A. They rely exclusively on manual labor and simple wooden tools", "B. (from the Thai key in the file): 20th century", "C. A sudden decline in urban population caused by severe droughts", "D. By encouraging governments to eliminate public education funding"], "answerIndex": 1, "answerText": "B. (from the Thai key in the file): 20th century", "randomized": true}, {"qEn": "5. What is the largest type of land animal in Antarctica?", "qTh": "5. สัตว์บกชนิดใดใหญ่ที่สุดในแอนตาร์กติกา เฉลย: แมลงวันไร้ปีก (wingless midge)", "options": ["A. (from the Thai key in the file): Wingless midge", "B. To prove that earlier scientific theories were entirely fabricated", "C. To compare ancient religious rituals with modern legal systems", "D. By encouraging governments to eliminate public education funding"], "answerIndex": 0, "answerText": "A. (from the Thai key in the file): Wingless midge", "randomized": true}, {"qEn": "6. Look at the four ¢ that indicate where the following sentence could be added to the passage: The research of the individuals living in Antarctica has been invaluable for learning about this remote part of the world. Where would the sentence best fit? Click on an option (A,B,C,D) to add the sentence to the passage. 3 ¢ A. Since the twentieth century humans have been living on the continent for research purposes. ¢ B. It has also been found that several invertebrates, including a wingless midge that is the largest land animals in Antarctica, have been found to live in the continent. ¢ C. After volcanic activity, lichens and moss have also been found growing. ¢D. In the Antarctic region, more than seven hundred species of algae and phytoplankton are found to live in the Antarctic Region.", "qTh": "6. ประโยค “การวิจัยของผู้คนที่อาศัยในแอนตาร์กติกามีค่าอย่างยิ่งในการเรียนรู้เกี่ยวกับส่วนที่ห่างไกลของโลก” เหมาะกับตํ let correctCount = 0;
let answeredCount = 0;

function populateTopicDropdown() {
  const sel = document.getElementById("topicSelect");
  examData.forEach(t => {
    const opt = document.createElement("option");
    opt.value = t.index;
    opt.textContent = `${t.index}. [${t.type}] ${t.title} (${t.questions.length} ข้อ)`;
    sel.appendChild(opt);
  });
}

function escapeHtml(str) {
  if (!str) return "";
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderQuiz() {
  const container = document.getElementById("quizContainer");
  const frag = document.createDocumentFragment();
  examData.forEach(topic => {
    const card = document.createElement("div");
    card.className = "topic-card";
    card.dataset.index = topic.index;
    card.dataset.type = topic.type;
    card.dataset.search = (topic.title + " " + topic.questions.map(q => q.qEn + " " + q.qTh).join(" ")).toLowerCase();

    let qHtml = "";
    topic.questions.forEach(q => {
      const optsHtml = q.options.map((opt, oIdx) =>
        `<li data-correct="${oIdx === q.answerIndex ? '1' : '0'}" onclick="selectOption(this)">${escapeHtml(opt)}</li>`
      ).join("");
      const randTag = q.randomized ? `<span class="random-tag">สุ่มตัวเลือกเสริม</span>` : "";
      qHtml += `
        <div class="question-block" data-answered="0">
          <div class="q-en">${escapeHtml(q.qEn)} ${randTag}</div>
          ${q.qTh ? `<div class="q-th">${escapeHtml(q.qTh)}</div>` : ""}
          <ul class="options">${optsHtml}</ul>
          <div class="answer-box"><strong>เฉลย:</strong> ${escapeHtml(q.answerText)}</div>
        </div>
      `;
    });

    card.innerHTML = `
      <div class="topic-header">
        <h2 class="topic-title">${topic.index}. ${escapeHtml(topic.title)}</h2>
        <span class="badge ${topic.type.toLowerCase()}">${topic.type} (${topic.questions.length} ข้อ)</span>
      </div>
      ${qHtml}
    `;
    frag.appendChild(card);
  });
  container.innerHTML = "";
  container.appendChild(frag);
}

function selectOption(el) {
  const block = el.closest(".question-block");
  const ul = el.parentElement;
  const isCorrect = el.dataset.correct === "1";

  if (block.dataset.answered === "0") {
    block.dataset.answered = "1";
    answeredCount++;
    if (isCorrect) correctCount++;
  } else {
    const prevCorrect = ul.querySelector("li.selected-correct");
    if (prevCorrect && !isCorrect) correctCount--;
    if (!prevCorrect && isCorrect) correctCount++;
  }

  for (let li of ul.children) {
    li.classList.remove("selected-correct", "selected-wrong");
  }
  el.classList.add(isCorrect ? "selected-correct" : "selected-wrong");
  ul.nextElementSibling.style.display = "block";
  updateScoreBoard();
}

function updateScoreBoard(visibleCount) {
  const totalVisible = visibleCount !== undefined ? visibleCount : document.querySelectorAll(".topic-card:not([style*='display: none'])").length;
  document.getElementById("scoreBoard").textContent = `แสดง ${totalVisible} เรื่อง | ตอบถูก ${correctCount} / ${answeredCount} ข้อ`;
}

function toggleAnswers() {
  document.body.classList.toggle("show-all-answers");
}

function resetQuiz() {
  correctCount = 0;
  answeredCount = 0;
  document.body.classList.remove("show-all-answers");
  renderQuiz();
  filterTopics();
}

function jumpToTopic() {
  filterTopics();
}

function filterTopics() {
  const query = document.getElementById("searchBox").value.toLowerCase();
  const type = document.getElementById("typeFilter").value;
  const selectedIdx = document.getElementById("topicSelect").value;
  let visible = 0;

  document.querySelectorAll(".topic-card").forEach(card => {
    const matchType = (type === "all" || card.dataset.type === type);
    const matchIdx = (selectedIdx === "all" || card.dataset.index === selectedIdx);
    const matchText = card.dataset.search.includes(query);
    const show = matchType && matchIdx && matchText;
    card.style.display = show ? "block" : "none";
    if (show) visible++;
  });
  updateScoreBoard(visible);
}

populateTopicDropdown();
renderQuiz();
updateScoreBoard(examData.length);
</script>
